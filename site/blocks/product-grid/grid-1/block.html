<div class="products-block" data-cols="{{ columns|default('3') }}" style="--primary-color: {{ primary_color|default('#6366f1') }}; --card-bg: {{ card_bg_color|default('#ffffff') }};">
    {% if title %}
    <h2 class="products-title">{{ title }}</h2>
    {% endif %}
    
    {% if show_filters != 'false' %}
    <div class="products-filters">
        <div class="filter-buttons" id="filterButtons-{{ id }}">
            <button data-cat="all" class="filter-btn active">Все</button>
        </div>
        {% if show_search != 'false' %}
        <div class="search-wrapper">
            <input type="text" id="searchInput-{{ id }}" class="search-input" placeholder="🔍 Поиск...">
        </div>
        {% endif %}
    </div>
    {% endif %}
    
    <div class="products-grid" id="productsGrid-{{ id }}">
        <div class="loading">Загрузка товаров...</div>
    </div>
</div>

<script>
    (function() {
        const blockId = '{{ id }}';
        const cols = {{ columns|default(3) }};
        const showFilters = {{ show_filters|default('true') }} === 'true';
        const showSearch = {{ show_search|default('true') }} === 'true';
        const primaryColor = '{{ primary_color|default("#6366f1") }}';
        
        let products = [];
        let categories = [];
        let currentFilter = 'all';
        let searchQuery = '';
        
        // ===== ЗАГРУЗКА ТОВАРОВ ИЗ CRM =====
        function loadProductsFromCRM() {
            const saved = localStorage.getItem('crm_data');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    products = data.products || [];
                    categories = data.categories || [];
                } catch(e) {
                    console.error('Ошибка загрузки товаров', e);
                }
            }
            
            // Если товаров нет — добавляем демо
            if (products.length === 0) {
                products = [
                    { id: 1, title: 'Хлопковая футболка', price: 1990, category_id: 1, images: [], emoji: '👕' },
                    { id: 2, title: 'Джинсы skinny', price: 3990, category_id: 1, images: [], emoji: '👖' },
                    { id: 3, title: 'Кеды белые', price: 2990, category_id: 2, images: [], emoji: '👟' }
                ];
                categories = [
                    { id: 1, title: 'Одежда' },
                    { id: 2, title: 'Обувь' }
                ];
            }
            
            renderFilters();
            renderProducts();
        }
        
        // ===== ОТРИСОВКА ФИЛЬТРОВ =====
        function renderFilters() {
            if (!showFilters) return;
            
            const container = document.getElementById(`filterButtons-${blockId}`);
            if (!container) return;
            
            let html = '<button data-cat="all" class="filter-btn active">Все</button>';
            categories.forEach(cat => {
                html += `<button data-cat="${cat.id}" class="filter-btn">${escapeHtml(cat.title)}</button>`;
            });
            container.innerHTML = html;
            
            // Навешиваем обработчики
            container.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.cat;
                    renderProducts();
                });
            });
        }
        
        // ===== ОТРИСОВКА ТОВАРОВ =====
        function renderProducts() {
            const container = document.getElementById(`productsGrid-${blockId}`);
            if (!container) return;
            
            let filtered = [...products];
            
            // Фильтр по категории
            if (currentFilter !== 'all') {
                filtered = filtered.filter(p => p.category_id == currentFilter);
            }
            
            // Поиск
            if (searchQuery) {
                filtered = filtered.filter(p => 
                    p.title.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-products">😔 Товары не найдены</div>';
                return;
            }
            
            // Определяем количество колонок
            let gridCols = 'repeat(3, 1fr)';
            if (cols === 2) gridCols = 'repeat(2, 1fr)';
            if (cols === 4) gridCols = 'repeat(4, 1fr)';
            
            container.style.display = 'grid';
            container.style.gridTemplateColumns = gridCols;
            container.style.gap = '24px';
            
            container.innerHTML = filtered.map((product, idx) => {
                const category = categories.find(c => c.id == product.category_id);
                const hasDiscount = product.discount_price && product.discount_price < product.price;
                const imageUrl = product.images && product.images.length > 0 ? product.images[0] : null;
                
                return `
                    <div class="product-card" data-id="${product.id}" style="--index: ${idx}; --primary-color: ${primaryColor}; --card-bg: ${primaryColor === '#6366f1' ? '#ffffff' : primaryColor};">
                        <div class="product-img">
                            ${imageUrl ? `<img src="${imageUrl}" alt="${escapeHtml(product.title)}">` : `<div class="product-emoji">${product.emoji || '👕'}</div>`}
                            ${hasDiscount ? `<span class="discount-badge">-${Math.round((1 - product.discount_price / product.price) * 100)}%</span>` : ''}
                        </div>
                        <div class="product-info">
                            <div class="product-title">${escapeHtml(product.title)}</div>
                            <div class="product-category">${category ? escapeHtml(category.title) : ''}</div>
                            <div class="product-price">
                                ${hasDiscount ? 
                                    `<span class="price-old">${product.price.toLocaleString()} ₽</span>
                                     <span class="price-current">${product.discount_price.toLocaleString()} ₽</span>` :
                                    `<span class="price-current">${product.price.toLocaleString()} ₽</span>`
                                }
                            </div>
                            <button class="add-to-cart" data-id="${product.id}">В корзину</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Навешиваем обработчики на кнопки "В корзину"
            container.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const productId = parseInt(btn.dataset.id);
                    const product = products.find(p => p.id === productId);
                    if (product) {
                        addToCart(product);
                        showToast(`✅ ${product.title} добавлен в корзину`);
                    }
                });
            });
        }
        
        // ===== КОРЗИНА =====
        let cart = [];
        
        function loadCart() {
            const saved = localStorage.getItem('trendCart');
            if (saved) {
                try { cart = JSON.parse(saved); } catch(e) {}
            }
            updateCartUI();
        }
        
        function saveCart() {
            localStorage.setItem('trendCart', JSON.stringify(cart));
            updateCartUI();
        }
        
        function addToCart(product) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            saveCart();
        }
        
        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            // Обновляем глобальный счётчик корзины, если он есть
            const cartCounter = document.getElementById('globalCartCounter');
            if (cartCounter) cartCounter.innerText = totalItems;
        }
        
        // ===== ПОИСК =====
        if (showSearch) {
            const searchInput = document.getElementById(`searchInput-${blockId}`);
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value;
                    renderProducts();
                });
            }
        }
        
        // ===== ВСПОМОГАТЕЛЬНЫЕ =====
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'products-toast';
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed; bottom: 20px; right: 20px; background: ${primaryColor}; color: white;
                padding: 12px 20px; border-radius: 30px; z-index: 1000;
                animation: slideInRight 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }
        
        // Добавляем стили для уведомлений, если их нет
        if (!document.querySelector('#products-block-styles')) {
            const style = document.createElement('style');
            style.id = 'products-block-styles';
            style.textContent = `
                @keyframes slideInRight {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
                @keyframes fadeOut {
                    to { opacity: 0; visibility: hidden; }
                }
            `;
            document.head.appendChild(style);
        }
        
        // Запуск
        loadCart();
        loadProductsFromCRM();
    })();
</script>
