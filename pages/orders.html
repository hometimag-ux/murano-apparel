<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы — Управление</title>
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        /* Дополнительные стили для страницы заказов */
        .orders-container {
            padding: 20px;
        }
        
        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .orders-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a2c3e;
            margin: 0;
        }
        
        .filters-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filters-bar select,
        .filters-bar input {
            padding: 10px 16px;
            border: 1px solid #cbdde9;
            border-radius: 40px;
            font-size: 0.85rem;
            background: white;
        }
        
        .search-input {
            min-width: 250px;
        }
        
        .orders-table-container {
            background: white;
            border-radius: 20px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 1000px;
        }
        
        .orders-table th {
            text-align: left;
            padding: 16px 12px;
            background: #f8f9fa;
            font-weight: 600;
            color: #1a2c3e;
            border-bottom: 1px solid #e9ecef;
        }
        
        .orders-table td {
            padding: 16px 12px;
            border-bottom: 1px solid #e9ecef;
            vertical-align: middle;
        }
        
        .orders-table tr:hover {
            background: #f8f9fa;
        }
        
        .order-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .status-new {
            background: #e3f2fd;
            color: #1976d2;
        }
        
        .status-paid {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .status-shipped {
            background: #fff3e0;
            color: #ef6c00;
        }
        
        .status-delivered {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .status-cancelled {
            background: #ffebee;
            color: #c62828;
        }
        
        .payment-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
        }
        
        .payment-card {
            background: #e8eaf6;
            color: #3949ab;
        }
        
        .payment-sbp {
            background: #e0f2f1;
            color: #00695c;
        }
        
        .payment-cash {
            background: #f3e5f5;
            color: #7b1fa2;
        }
        
        .order-items-preview {
            max-width: 250px;
            font-size: 0.7rem;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .order-total {
            font-weight: 700;
            color: #00897b;
        }
        
        .view-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 6px 10px;
            border-radius: 30px;
            transition: 0.2s;
            color: #00897b;
        }
        
        .view-btn:hover {
            background: #e0f2f1;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
        }
        
        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #00897b, #4db6ac);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 137, 123, 0.3);
        }
        
        /* Модальное окно деталей заказа */
        .order-details-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        
        .order-details-content {
            background: white;
            border-radius: 28px;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            overflow-y: auto;
            animation: modalSlideIn 0.3s ease;
        }
        
        .order-details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e2edf4;
            position: sticky;
            top: 0;
            background: white;
        }
        
        .order-details-header h3 {
            margin: 0;
            font-size: 1.2rem;
        }
        
        .order-details-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #94a3b8;
        }
        
        .order-details-body {
            padding: 1.5rem;
        }
        
        .details-section {
            margin-bottom: 1.5rem;
        }
        
        .details-section h4 {
            margin: 0 0 0.8rem 0;
            font-size: 0.9rem;
            color: #1a2c3e;
        }
        
        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 16px;
        }
        
        .details-item {
            display: flex;
            flex-direction: column;
        }
        
        .details-label {
            font-size: 0.7rem;
            color: #64748b;
        }
        
        .details-value {
            font-weight: 600;
            font-size: 0.9rem;
            color: #1a2c3e;
        }
        
        .order-items-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        
        .order-items-table th,
        .order-items-table td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #e2edf4;
        }
        
        .order-items-table th {
            background: #f8fafc;
            font-weight: 600;
        }
        
        .status-select {
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid #cbdde9;
            font-size: 0.75rem;
            cursor: pointer;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
<div class="admin-container">
    <!-- Боковое меню -->
    <aside class="admin-sidebar">
        <div class="admin-logo">🛍️ CRM Shop</div>
        <nav class="admin-nav">
            <a href="products.html" class="nav-item">
                <span class="nav-icon">📦</span>
                <span>Товары</span>
            </a>
            <a href="orders.html" class="nav-item active">
                <span class="nav-icon">📋</span>
                <span>Заказы</span>
            </a>
            <a href="clients.html" class="nav-item">
                <span class="nav-icon">👥</span>
                <span>Клиенты</span>
            </a>
            <a href="analytics.html" class="nav-item">
                <span class="nav-icon">📊</span>
                <span>Аналитика</span>
            </a>
            <a href="settings.html" class="nav-item">
                <span class="nav-icon">⚙️</span>
                <span>Настройки</span>
            </a>
        </nav>
    </aside>

    <!-- Основной контент -->
    <main class="admin-main">
        <div class="orders-container">
            <div class="orders-header">
                <h1>📋 Заказы</h1>
                <div class="filters-bar">
                    <input type="text" id="searchOrders" class="search-input" placeholder="🔍 Поиск по заказу, клиенту...">
                    <select id="statusFilter">
                        <option value="all">Все статусы</option>
                        <option value="new">🆕 Новый</option>
                        <option value="paid">💳 Оплачен</option>
                        <option value="shipped">🚚 Отправлен</option>
                        <option value="delivered">✅ Доставлен</option>
                        <option value="cancelled">❌ Отменён</option>
                    </select>
                    <select id="paymentFilter">
                        <option value="all">Все способы оплаты</option>
                        <option value="card">💳 Картой</option>
                        <option value="sbp">📱 СБП</option>
                        <option value="cash">💰 Наличные</option>
                    </select>
                    <button class="refresh-btn" id="refreshOrders">🔄 Обновить</button>
                </div>
            </div>

            <div class="orders-table-container">
                <table class="orders-table" id="ordersTable">
                    <thead>
                        <tr>
                            <th>№ заказа</th>
                            <th>Дата</th>
                            <th>Клиент</th>
                            <th>Товары</th>
                            <th>Сумма</th>
                            <th>Оплата</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="8" class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <p>Нет заказов</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script>
    // Хранилище заказов
    let orders = [];
    
    // Загрузка заказов из localStorage
    function loadOrders() {
        console.log('🔄 Загрузка заказов...');
        
        // Загружаем заказы из crm_data
        const saved = localStorage.getItem('crm_data');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                orders = data.orders || [];
                console.log(`✅ Загружено заказов: ${orders.length}`);
            } catch(e) {
                console.error('Ошибка загрузки заказов', e);
                orders = [];
            }
        }
        
        // Также проверяем failedOrders
        const failed = localStorage.getItem('failedOrders');
        if (failed) {
            try {
                const failedOrders = JSON.parse(failed);
                if (failedOrders.length > 0) {
                    console.log(`⚠️ Есть неотправленные заказы: ${failedOrders.length}`);
                }
            } catch(e) {}
        }
        
        renderOrdersTable();
    }
    
    // Сохранение заказов
    function saveOrders() {
        const saved = localStorage.getItem('crm_data');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                data.orders = orders;
                localStorage.setItem('crm_data', JSON.stringify(data));
            } catch(e) {}
        } else {
            localStorage.setItem('crm_data', JSON.stringify({ orders: orders, products: [], categories: [], leads: [], messages: {}, settings: {} }));
        }
        console.log('💾 Заказы сохранены');
    }
    
    // Обновление статуса заказа
    function updateOrderStatus(orderId, newStatus) {
        const order = orders.find(o => o.order_id === orderId);
        if (order) {
            order.status = newStatus;
            saveOrders();
            renderOrdersTable();
            showToast(`Статус заказа №${orderId} изменён на ${getStatusName(newStatus)}`);
        }
    }
    
    function getStatusName(status) {
        const names = {
            'new': '🆕 Новый',
            'paid': '💳 Оплачен',
            'shipped': '🚚 Отправлен',
            'delivered': '✅ Доставлен',
            'cancelled': '❌ Отменён'
        };
        return names[status] || status;
    }
    
    function getPaymentName(payment) {
        const names = {
            'card': '💳 Картой',
            'sbp': '📱 СБП',
            'cash': '💰 Наличные'
        };
        return names[payment] || payment;
    }
    
    function getStatusClass(status) {
        const classes = {
            'new': 'status-new',
            'paid': 'status-paid',
            'shipped': 'status-shipped',
            'delivered': 'status-delivered',
            'cancelled': 'status-cancelled'
        };
        return classes[status] || 'status-new';
    }
    
    function getPaymentClass(payment) {
        const classes = {
            'card': 'payment-card',
            'sbp': 'payment-sbp',
            'cash': 'payment-cash'
        };
        return classes[payment] || 'payment-card';
    }
    
    // Открытие деталей заказа
    function openOrderDetails(orderId) {
        const order = orders.find(o => o.order_id === orderId);
        if (!order) return;
        
        const modalHtml = `
            <div class="order-details-modal" id="orderDetailsModal">
                <div class="order-details-content">
                    <div class="order-details-header">
                        <h3>📋 Заказ №${order.order_id}</h3>
                        <button class="order-details-close" id="closeDetailsModal">&times;</button>
                    </div>
                    <div class="order-details-body">
                        <div class="details-section">
                            <h4>Информация о заказе</h4>
                            <div class="details-grid">
                                <div class="details-item">
                                    <span class="details-label">Дата заказа</span>
                                    <span class="details-value">${order.date || '—'}</span>
                                </div>
                                <div class="details-item">
                                    <span class="details-label">Статус</span>
                                    <div class="details-value">
                                        <select class="status-select" id="orderStatusSelect">
                                            <option value="new" ${order.status === 'new' ? 'selected' : ''}>🆕 Новый</option>
                                            <option value="paid" ${order.status === 'paid' ? 'selected' : ''}>💳 Оплачен</option>
                                            <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>🚚 Отправлен</option>
                                            <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>✅ Доставлен</option>
                                            <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>❌ Отменён</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="details-item">
                                    <span class="details-label">Способ оплаты</span>
                                    <span class="details-value">${getPaymentName(order.payment)}</span>
                                </div>
                                <div class="details-item">
                                    <span class="details-label">Сумма заказа</span>
                                    <span class="details-value order-total">${order.total.toLocaleString()} ₽</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="details-section">
                            <h4>Клиент</h4>
                            <div class="details-grid">
                                <div class="details-item">
                                    <span class="details-label">Имя</span>
                                    <span class="details-value">${escapeHtml(order.customer?.name || '—')}</span>
                                </div>
                                <div class="details-item">
                                    <span class="details-label">Телефон</span>
                                    <span class="details-value">${escapeHtml(order.customer?.phone || '—')}</span>
                                </div>
                                <div class="details-item">
                                    <span class="details-label">Email</span>
                                    <span class="details-value">${escapeHtml(order.customer?.email || '—')}</span>
                                </div>
                            </div>
                        </div>
                        
                        ${order.delivery ? `
                        <div class="details-section">
                            <h4>Доставка</h4>
                            <div class="details-grid">
                                <div class="details-item">
                                    <span class="details-label">Способ доставки</span>
                                    <span class="details-value">${order.delivery.method === 'courier' ? '🚚 Курьер' : order.delivery.method === 'pickup' ? '📦 Самовывоз' : order.delivery.method}</span>
                                </div>
                                <div class="details-item">
                                    <span class="details-label">Стоимость доставки</span>
                                    <span class="details-value">${order.delivery.price === 0 ? 'Бесплатно' : order.delivery.price.toLocaleString() + ' ₽'}</span>
                                </div>
                                ${order.address ? `
                                <div class="details-item">
                                    <span class="details-label">Адрес</span>
                                    <span class="details-value">${escapeHtml(order.address)}</span>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                        ` : ''}
                        
                        <div class="details-section">
                            <h4>Товары в заказе</h4>
                            <table class="order-items-table">
                                <thead>
                                    <tr>
                                        <th>Товар</th>
                                        <th>Размер</th>
                                        <th>Цвет</th>
                                        <th>Артикул</th>
                                        <th>Кол-во</th>
                                        <th>Цена</th>
                                        <th>Сумма</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${order.items.map(item => `
                                        <tr>
                                            <td>${escapeHtml(item.title)}</td>
                                            <td>${escapeHtml(item.size || '—')}</td>
                                            <td>${escapeHtml(item.color || '—')}</td>
                                            <td>${escapeHtml(item.article || '—')}</td>
                                            <td>${item.quantity}</td>
                                            <td>${item.price.toLocaleString()} ₽</td>
                                            <td>${(item.price * item.quantity).toLocaleString()} ₽</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        
                        ${order.comment ? `
                        <div class="details-section">
                            <h4>Комментарий</h4>
                            <div style="background:#f8fafc; padding:12px; border-radius:16px;">
                                ${escapeHtml(order.comment)}
                            </div>
                        </div>
                        ` : ''}
                    </div>
                </div>
            </div>
        `;
        
        const oldModal = document.getElementById('orderDetailsModal');
        if (oldModal) oldModal.remove();
        
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        document.body.style.overflow = 'hidden';
        
        const closeBtn = document.getElementById('closeDetailsModal');
        const modal = document.getElementById('orderDetailsModal');
        const statusSelect = document.getElementById('orderStatusSelect');
        
        if (closeBtn) {
            closeBtn.onclick = () => {
                modal.remove();
                document.body.style.overflow = '';
            };
        }
        
        if (modal) {
            modal.onclick = (e) => {
                if (e.target === modal) {
                    modal.remove();
                    document.body.style.overflow = '';
                }
            };
        }
        
        if (statusSelect) {
            statusSelect.onchange = () => {
                updateOrderStatus(order.order_id, statusSelect.value);
                modal.remove();
                document.body.style.overflow = '';
                openOrderDetails(order.order_id);
            };
        }
    }
    
    // Рендер таблицы заказов
    function renderOrdersTable() {
        const tbody = document.getElementById('ordersTableBody');
        const searchTerm = document.getElementById('searchOrders')?.value.toLowerCase() || '';
        const statusFilter = document.getElementById('statusFilter')?.value || 'all';
        const paymentFilter = document.getElementById('paymentFilter')?.value || 'all';
        
        let filtered = [...orders];
        
        if (searchTerm) {
            filtered = filtered.filter(o => 
                o.order_id.toLowerCase().includes(searchTerm) ||
                (o.customer?.name && o.customer.name.toLowerCase().includes(searchTerm)) ||
                (o.customer?.phone && o.customer.phone.includes(searchTerm))
            );
        }
        
        if (statusFilter !== 'all') {
            filtered = filtered.filter(o => o.status === statusFilter);
        }
        
        if (paymentFilter !== 'all') {
            filtered = filtered.filter(o => o.payment === paymentFilter);
        }
        
        // Сортировка по дате (новые сверху)
        filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        if (filtered.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="8" class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>Нет заказов</p>
                    </td>
                </tr>
            `;
            return;
        }
        
        tbody.innerHTML = filtered.map(order => {
            const itemsPreview = order.items.slice(0, 2).map(i => i.title).join(', ');
            const moreItems = order.items.length > 2 ? ` +${order.items.length - 2}` : '';
            
            return `
                <tr>
                    <td><strong>${order.order_id}</strong></td>
                    <td>${order.date || '—'}</td>
                    <td>
                        <div><strong>${escapeHtml(order.customer?.name || '—')}</strong></div>
                        <div style="font-size:0.7rem; color:#666;">${escapeHtml(order.customer?.phone || '—')}</div>
                    </td>
                    <td>
                        <div class="order-items-preview" title="${escapeHtml(order.items.map(i => i.title).join(', '))}">
                            ${escapeHtml(itemsPreview)}${moreItems}
                        </div>
                    </td>
                    <td class="order-total">${order.total.toLocaleString()} ₽</td>
                    <td><span class="payment-badge ${getPaymentClass(order.payment)}">${getPaymentName(order.payment)}</span></td>
                    <td><span class="order-status ${getStatusClass(order.status)}">${getStatusName(order.status)}</span></td>
                    <td>
                        <button class="view-btn" onclick="openOrderDetails('${order.order_id}')" title="Просмотр">👁️</button>
                    </td>
                </tr>
            `;
        }).join('');
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function showToast(msg) {
        let t = document.getElementById('adminToast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'adminToast';
            t.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#1a2c3e;color:white;padding:12px 24px;border-radius:40px;z-index:100000;font-size:14px;opacity:0;transition:0.3s';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        setTimeout(() => t.style.opacity = '0', 3000);
    }
    
    // Инициализация
    document.addEventListener('DOMContentLoaded', function() {
        loadOrders();
        
        document.getElementById('searchOrders').addEventListener('input', () => renderOrdersTable());
        document.getElementById('statusFilter').addEventListener('change', () => renderOrdersTable());
        document.getElementById('paymentFilter').addEventListener('change', () => renderOrdersTable());
        document.getElementById('refreshOrders').addEventListener('click', () => loadOrders());
    });
    
    // Делаем функции глобальными
    window.openOrderDetails = openOrderDetails;
    window.updateOrderStatus = updateOrderStatus;
</script>
</body>
</html>
